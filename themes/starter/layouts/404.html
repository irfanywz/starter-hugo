{{ define "main" }}
<main id="main" class="mx-auto flex w-full max-w-3xl flex-1 flex-col items-center justify-center px-4 py-20 text-center">
  <p class="text-7xl font-extrabold text-primary dark:text-blue-400">404</p>
  <h1 class="mt-4 text-2xl font-bold">{{ i18n "not_found" }}</h1>
  <a href="{{ "/" | relURL }}" class="mt-8 inline-block rounded-lg bg-primary px-5 py-2.5 font-medium text-white shadow transition hover:opacity-90">{{ i18n "back_home" }}</a>
</main>
{{ end }}
