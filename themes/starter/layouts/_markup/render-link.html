{{- $dest := .Destination -}}
{{- $external := or (strings.HasPrefix $dest "http://") (strings.HasPrefix $dest "https://") -}}
<a href="{{ $dest | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text }}{{ if $external }}<span class="icon-[lucide--external-link] ml-0.5 inline-block size-3.5 align-baseline opacity-60" aria-hidden="true"></span>{{ end }}</a>
