{{- /* Konteks: objek pager dari .Paginate */ -}}
{{ if gt .TotalPages 1 }}
  <nav aria-label="{{ i18n "pagination" }}" class="mt-10 flex items-center justify-between gap-4 text-sm font-medium">
    {{ if .HasPrev }}
      <a href="{{ .Prev.URL }}" rel="prev" class="rounded-lg border border-slate-200 bg-white px-4 py-2 hover:border-primary dark:border-slate-800 dark:bg-slate-900 dark:hover:border-blue-400">← {{ i18n "newer" }}</a>
    {{ else }}<span></span>{{ end }}
    <span class="text-slate-500 dark:text-slate-400">{{ .PageNumber }} / {{ .TotalPages }}</span>
    {{ if .HasNext }}
      <a href="{{ .Next.URL }}" rel="next" class="rounded-lg border border-slate-200 bg-white px-4 py-2 hover:border-primary dark:border-slate-800 dark:bg-slate-900 dark:hover:border-blue-400">{{ i18n "older" }} →</a>
    {{ else }}<span></span>{{ end }}
  </nav>
{{ end }}
