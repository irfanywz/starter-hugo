<article class="flex flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-xs transition-shadow hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
  <h3 class="text-lg font-bold leading-snug">
    <a href="{{ .RelPermalink }}" class="hover:text-primary dark:hover:text-blue-400">{{ .Title }}</a>
  </h3>
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
    {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ time.Format ":date_long" .Date }}</time> · {{ end }}{{ i18n "reading_time" .ReadingTime }}
  </p>
  <p class="mt-3 flex-1 text-sm text-slate-600 dark:text-slate-300">
    {{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}
  </p>
  <a href="{{ .RelPermalink }}" class="mt-4 text-sm font-medium text-primary hover:underline dark:text-blue-400">{{ i18n "read_more" }} →</a>
</article>
