{{ define "main" }}
<main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-10">
  <header class="mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">{{ .Title }}</h1>
    {{ with .Content }}<div class="prose prose-slate mt-4 dark:prose-invert">{{ . }}</div>{{ end }}
  </header>
  <ul class="flex flex-wrap gap-3">
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a href="{{ .Page.RelPermalink }}" class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium transition-colors hover:border-primary hover:text-primary dark:border-slate-800 dark:bg-slate-900 dark:hover:border-blue-400 dark:hover:text-blue-400">
          #{{ .Page.LinkTitle }}
          <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-500 dark:bg-slate-800 dark:text-slate-400">{{ .Count }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
</main>
{{ end }}
