{{- /* Parameter: summary (judul), open (true/false). Panggil dengan sintaks persen agar isinya diproses sebagai markdown. */ -}}
<details class="my-4 rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900"{{ if eq (printf "%v" (.Get "open")) "true" }} open{{ end }}>
  <summary class="cursor-pointer font-semibold">{{ .Get "summary" | default (i18n "details") }}</summary>
  <div class="mt-3 [&>*:first-child]:mt-0 [&>*:last-child]:mb-0">
    {{ .Inner }}
  </div>
</details>
