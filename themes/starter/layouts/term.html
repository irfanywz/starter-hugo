{{ define "main" }}
<main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-10">
  <header class="mb-8">
    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">{{ i18n "topics" }}</p>
    <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">#{{ .Title }}</h1>
  </header>
  {{ partial "post-list.html" (dict "page" . "pages" .Pages) }}
</main>
{{ end }}
